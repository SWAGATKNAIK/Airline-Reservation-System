{% extends 'base_admin.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Delete Passenger Account</h4>
                </div>
                <div class="card-body text-center">
                    <p class="lead">Are you sure you want to delete the account for <strong>{{ passenger.get_full_name }} ({{ passenger.username }})</strong>?</p>
                    <p class="text-danger fw-bold">Warning: This will also delete all their flight reservations!</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'admin_passenger_list' %}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
