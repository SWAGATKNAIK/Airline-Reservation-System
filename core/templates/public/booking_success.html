{% extends 'base_public.html' %}

{% block content %}
<div class="container my-5 text-center">
    <div class="card shadow-lg p-5 border-0 d-inline-block">
        <div class="text-success mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <h2 class="fw-bold text-success">Booking Confirmed!</h2>
        <p class="lead mt-3">You have successfully booked <strong>{{ count }}</strong> ticket(s).</p>
        <p class="text-muted">A confirmation email has been sent to your registered address.</p>
        
        <div class="mt-4">
            <a href="{% url 'home' %}" class="btn btn-primary">Return to Home</a>
            <!-- FIX: Updated href to point to the customer bookings URL -->
            <a href="{% url 'customer_bookings' %}" class="btn btn-outline-secondary ms-2">View My Bookings</a>
        </div>
    </div>
</div>
{% endblock %}
