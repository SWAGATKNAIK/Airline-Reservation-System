{% extends 'base_public.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Passenger Details</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted">Please enter the full name for each passenger as it appears on their ID.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {% for seat in selected_seats %}
                        <div class="card mb-3 border-start border-4 border-info">
                            <div class="card-body">
                                <h5 class="card-title">Seat: {{ seat }}</h5>
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="passenger_name_{{ seat }}" class="form-control" required placeholder="e.g. John Doe">
                                </div>
                            </div>
                        </div>
                        {% endfor %}

                        <div class="d-flex justify-content-between mt-4">
                            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
                            <button type="submit" class="btn btn-success btn-lg">Review & Pay</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
