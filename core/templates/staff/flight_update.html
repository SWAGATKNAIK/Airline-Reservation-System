{% extends 'base_staff.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">Update Flight Status</h5>
                </div>
                <div class="card-body">
                    <h4 class="text-primary">{{ flight.flight_number }}</h4>
                    <p class="text-muted">{{ flight.origin }} ➝ {{ flight.destination }}</p>
                    <hr>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Current Status</label>
                            {{ form.status }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Gate Number</label>
                            {{ form.gate }}
                            <div class="form-text">Enter the boarding gate (e.g., A12, B4).</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update Flight</button>
                            <a href="{% url 'staff_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
