<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - SkyHigh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #0d6efd; color: white; }
        .sidebar a { color: white; text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Staff Sidebar -->
        <div class="sidebar p-3" style="width: 250px;">
            <h4>Staff Portal</h4>
            <hr>
            <a href="{% url 'staff_dashboard' %}">📊 Daily Overview</a>
    
    <!-- New Search Link -->
    <a href="{% url 'staff_search_passenger' %}">🔍 Search Passenger</a>
    
    <!-- Moved Operations Link -->
    <a href="{% url 'staff_checkin_manager' %}">🎫 Check-in & Gates</a>
    
            <a href="{% url 'logout' %}" class="mt-5 text-warning">🚪 Logout</a>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4">
            <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded px-3">
                <span class="navbar-brand mb-0 h1">Welcome, Agent {{ user.first_name }}</span>
            </nav>
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
