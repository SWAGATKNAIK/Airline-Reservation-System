<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkyHigh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; }
        .sidebar {
            min-height: 100vh;
            width: 250px;
            background-color: #212529;
            color: white;
            position: fixed;
            transition: margin 0.3s;
        }
        .sidebar .nav-link { color: #adb5bd; padding: 10px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: #343a40; }
        .content { margin-left: 250px; transition: margin 0.3s; width: 100%; }
        
        @media (max-width: 768px) {
            .sidebar { margin-left: -250px; }
            .sidebar.active { margin-left: 0; }
            .content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="py-4 px-3 mb-3 border-bottom border-secondary">
                <h4 class="fw-bold">Admin Panel</h4>
                <small>SkyHigh Airlines</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="{% url 'admin_dashboard' %}" class="nav-link active">📊 Dashboard</a></li>
                <li class="nav-item"><a href="{% url 'admin_flight_list' %}" class="nav-link">✈️ Manage Flights</a></li>
                <li class="nav-item"><a href="{% url 'admin_aircraft_list' %}" class="nav-link">💺 Aircrafts</a></li>
                <li class="nav-item"><a href="{% url 'admin_staff_list' %}" class="nav-link">👔 Staff Management</a></li>
                <li class="nav-item"><a href="{% url 'admin_passenger_list' %}" class="nav-link">👥 Passengers</a></li>
                <li class="nav-item"><a href="{% url 'admin_reservation_list' %}" class="nav-link">🎫 Bookings & Tickets</a></li>
                <li class="nav-item"><a href="#" class="nav-link">📑 Reports</a></li>
                <li class="nav-item mt-5"><a href="{% url 'logout' %}" class="nav-link text-danger">🚪 Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Admin Navbar -->
            <nav class="navbar navbar-light bg-light shadow-sm px-4">
                <button class="btn btn-outline-dark d-md-none" id="sidebarToggle">☰</button>
                <span class="ms-auto fw-bold">Administrator: {{ user.username }}</span>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
